name: Build desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-cache/rust
      CLARO_OFFLINE_DIR: ${{ github.workspace }}/build-cache/native/offline-native/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native CPU offline engine
        run: python scripts/build-offline.py --cache build-cache/native --jobs 4
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Archive app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build-cache/rust/release/bundle/macos/Claro.app Claro-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Claro-${{ runner.os }}-${{ runner.arch }}
          path: |
            Claro-macOS.zip
            build-cache/rust/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
